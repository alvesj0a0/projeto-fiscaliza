name: fiscaliza_para
description: "Sistema de Fiscalizacao e Monitoramento dos Programas de Alimentacao e Transporte Escolar da SEDUC-PA"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '^3.11.0'
  flutter: ">=3.19.0"

dependencies:
  uuid: ^4.3.3
  connectivity_plus: ^6.0.3
  pdf: ^3.10.8
  printing: ^5.13.0
  qr_flutter: ^4.1.0
  flutter:
    sdk: flutter


  # Banco de Dados Local (Offline-First)
  sqflite: ^2.3.2
  sqflite_common_ffi: ^2.3.2
  sqflite_common_ffi_web: ^0.4.5+4
  path: ^1.9.0

  # Criptografia para Hash Auditável (SHA-256)
  crypto: ^3.0.3

  # Geolocalização e Formatação de Datas
  geolocator: ^12.0.0
  intl: ^0.19.0

  # Câmera (evidências fotográficas)
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true